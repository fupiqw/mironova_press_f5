<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - ПРЕСС Ф5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">PRESS <span>F5</span></a>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="about.html">О компании</a></li>
                <li><a href="services.html">Услуги</a></li>
                <li><a href="contacts.html">Контакты</a></li>
            </ul>
        </nav>
        <div class="burger">
            <div></div><div></div><div></div>
        </div>
    </header>

    <section>
        <div id="loginScreen" style="max-width: 400px; margin: 0 auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);">
            <h2 style="text-align: center; margin-bottom: 20px; color: #0f172a;">Вход для администратора</h2>
            
            <div class="form-group">
                <label for="adminLogin">Логин:</label>
                <input type="text" id="adminLogin" placeholder="admin">
            </div>
            <div class="form-group">
                <label for="adminPass">Пароль:</label>
                <input type="password" id="adminPass" placeholder="1234">
            </div>
            
            <button onclick="checkAdminLogin()" class="btn" style="width: 100%;">Войти</button>
        </div>

        <div id="adminPanel" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 class="section-title" style="margin-bottom: 0;">Панель администратора</h2>
                <button onclick="logoutAdmin()" class="btn-small" style="background: #e11d48; color: white;">Выйти</button>
            </div>
            
            <div class="admin-controls">
                <input type="text" id="searchInput" placeholder="Поиск по имени/email">
                <select id="statusFilter">
                    <option value="Все">Все статусы</option>
                    <option value="Новая">Новые</option>
                    <option value="В обработке">В обработке</option>
                </select>
            </div>

            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Дата</th>
                            <th>Имя</th>
                            <th>Email</th>
                            <th>Сообщение</th>
                            <th>Статус</th>
                            <th>Действие</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <!-- Сюда JS будет вставлять заявки -->
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 ООО "ПРЕСС Ф5". Все права защищены.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
