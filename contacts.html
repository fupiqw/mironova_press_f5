    <header>
        <a href="index.html" class="logo">PRESS <span>F5</span></a>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="about.html">О компании</a></li>
                <li><a href="services.html">Услуги</a></li>
                <li><a href="contacts.html" class="active">Контакты</a></li>
            </ul>
        </nav>
        <div class="burger">
            <div></div><div></div><div></div>
        </div>
    </header>

    <section>
        <h2 class="section-title">Свяжитесь с нами</h2>
        
        <div class="contact-container">
            <!-- Левая часть: Контакты (впиши свои данные вместо заглушек) -->
            <div class="contact-info">
                <h3>Наши контакты</h3>
                <p><strong>Телефон:</strong> 8 910 972 11 47</p>
                <p><strong>Email:</strong> ooo.pressf5@mail.ru</p>
                <p><strong>Адрес:</strong> г. Ярославль, ул. Блюхера, д. 86/9</p>
                <p><strong>Режим работы:</strong> Пн-Сб с 9:00 до 18:00</p>
            </div>

            <!-- Правая часть: Форма -->
            <div class="contact-form">
                <h3>Оставить заявку</h3>
                                <form id="feedbackForm">
                    <div class="form-group">
                        <label for="name">Ваше имя:</label>
                        <input type="text" id="name" placeholder="Иван Иванов">
                    </div>
                    <div class="form-group">
                        <label for="email">Ваш Email:</label>
                        <input type="email" id="email" placeholder="ivan@mail.ru">
                    </div>
                    <div class="form-group">
                        <label for="message">Сообщение:</label>
                        <textarea id="message" rows="4" placeholder="Опишите вашу задачу..."></textarea>
                    </div>
                    <div class="form-group" style="display: flex; gap: 10px; align-items: center;">
                        <input type="checkbox" id="consent" style="width: auto;">
                        <label for="consent" style="margin-bottom: 0; font-weight: 400;">Я согласен на обработку персональных данных</label>
                    </div>
                    <button type="submit" class="btn">Отправить</button>
                </form>
            </div>
        </div>
    </section>
